name: Set up Rust platform dependencies
description: Install the pinned Rust toolchain and native Linux build dependencies.

inputs:
  components:
    description: Optional Rust toolchain components.
    required: false
    default: ""
  target:
    description: Optional Rust compilation target.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: 1.90.0
        components: ${{ inputs.components }}
        targets: ${{ inputs.target }}
    - name: Install Linux build dependencies
      if: runner.os == 'Linux' && inputs.target != 'i686-unknown-linux-gnu'
      shell: bash
      run: |
        bash "$GITHUB_WORKSPACE/.github/scripts/with-ubuntu-apt.sh" sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev libudev-dev
    - name: Install 32-bit Linux build dependencies
      if: runner.os == 'Linux' && inputs.target == 'i686-unknown-linux-gnu'
      shell: bash
      run: |
        sudo dpkg --add-architecture i386
        bash "$GITHUB_WORKSPACE/.github/scripts/with-ubuntu-apt.sh" sudo apt-get install -y gcc-multilib g++-multilib pkg-config \
          libx11-dev:i386 libxkbcommon-dev:i386 libwayland-dev:i386 libudev-dev:i386
        {
          echo 'PKG_CONFIG_ALLOW_CROSS=1'
          echo 'PKG_CONFIG_LIBDIR=/usr/lib/i386-linux-gnu/pkgconfig:/usr/share/pkgconfig'
          echo 'CARGO_TARGET_I686_UNKNOWN_LINUX_GNU_LINKER=gcc'
        } >> "$GITHUB_ENV"
    - name: Disable incremental compilation
      shell: bash
      run: echo 'CARGO_INCREMENTAL=0' >> "$GITHUB_ENV"
    - name: Cache Rust dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        cache-on-failure: true
