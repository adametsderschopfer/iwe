name: Code Checks

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select platforms
    runs-on: ubuntu-24.04
    outputs:
      checks: ${{ steps.plan.outputs.checks }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - id: plan
        env:
          REF_TYPE: branch
          REF_NAME: ${{ github.ref_name }}
        run: python3 .github/scripts/release-plan.py

  format:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.90.0
          components: rustfmt
      - run: cargo fmt --all -- --check
      - uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6
        with:
          dprint-version: 0.64.3

  security:
    name: Dependency security
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: 1.90.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit dependency lockfile
        run: cargo audit --file Cargo.lock

  release_scripts:
    name: Release script checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - run: python3 -m unittest discover -s .github/scripts/tests -v

  lint:
    name: Lint (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings

  typecheck:
    name: Type check (${{ matrix.os }})
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-rust
      - run: cargo check --locked --all-targets --all-features

  unit_tests:
    name: Unit tests (${{ matrix.target }})
    needs: [plan, format, lint, security, typecheck, release_scripts]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.targets) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-rust
        with:
          target: ${{ matrix.target }}
      - run: cargo test --locked --all-features --target ${{ matrix.target }} --bin iwe

  integration_tests:
    name: Integration tests (${{ matrix.os }})
    needs: [plan, format, lint, security, typecheck, release_scripts]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.checks) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: ./.github/actions/setup-rust
      - name: Discover integration tests
        id: integration
        shell: pwsh
        run: |
          $metadataJson = cargo metadata --locked --no-deps --format-version 1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $metadata = $metadataJson | ConvertFrom-Json
          $targets = @($metadata.packages |
            Where-Object { $metadata.workspace_members -contains $_.id } |
            ForEach-Object { $_.targets } |
            Where-Object { $_.kind -contains 'test' })
          if ($targets.Count -eq 0) {
            'available=false' >> $env:GITHUB_OUTPUT
            'No integration test targets exist. No integration tests were run.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            'available=true' >> $env:GITHUB_OUTPUT
          }
      - name: Run integration tests
        if: steps.integration.outputs.available == 'true'
        run: cargo test --locked --workspace --all-features --test '*'

  website_format:
    name: Website formatting
    defaults:
      run:
        working-directory: website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check

  website_lint:
    name: Website lint
    defaults:
      run:
        working-directory: website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint

  website_typecheck:
    name: Website type check
    defaults:
      run:
        working-directory: website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  website_security:
    name: Website dependency security
    defaults:
      run:
        working-directory: website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate

  website_build:
    name: Build website
    needs: [website_format, website_lint, website_typecheck, website_security]
    defaults:
      run:
        working-directory: website
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - name: Generate static website
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: ${{ format('/{0}', github.event.repository.name) }}/
      - name: Verify generated pages
        run: npm test
        env:
          NUXT_APP_BASE_URL: ${{ format('/{0}', github.event.repository.name) }}/
      - name: Install browser test runtime
        run: bash "$GITHUB_WORKSPACE/.github/scripts/with-ubuntu-apt.sh" npx playwright install --with-deps chromium
      - name: Verify scrolling in the browser
        run: npm run test:browser
        env:
          NUXT_APP_BASE_URL: ${{ format('/{0}', github.event.repository.name) }}/
