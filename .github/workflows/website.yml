name: Публикация сайта

on:
  pull_request:
    paths:
      - website/**
      - LICENSE
      - .github/workflows/website.yml
      - .github/scripts/with-ubuntu-apt.sh
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: website-publication
  cancel-in-progress: true

defaults:
  run:
    working-directory: website

jobs:
  format:
    name: Форматирование сайта
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Линтер сайта
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Проверка типов сайта
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  security:
    name: Безопасность зависимостей сайта
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate

  build:
    name: Сборка сайта
    needs: [format, lint, typecheck, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Read GitHub Pages configuration
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - run: npm ci
      - name: Generate static website
        run: npm run generate
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}/
      - name: Verify generated pages
        run: npm test
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}/
      - name: Install browser test runtime
        run: bash "$GITHUB_WORKSPACE/.github/scripts/with-ubuntu-apt.sh" npx playwright install --with-deps chromium
      - name: Verify scrolling in the browser
        run: npm run test:browser
        env:
          NUXT_APP_BASE_URL: ${{ steps.pages.outputs.base_path || format('/{0}', github.event.repository.name) }}/
      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/.output/public

  deploy:
    name: Публикация GitHub Pages
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
