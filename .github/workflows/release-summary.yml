name: Release summary

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: Published platform version to summarize
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-summary
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (startsWith(github.event.workflow_run.head_branch, 'macos-v') ||
      startsWith(github.event.workflow_run.head_branch, 'windows-v') ||
      startsWith(github.event.workflow_run.head_branch, 'linux-v')))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Verify summary publication rules
        run: python3 -m unittest discover -s .github/scripts/tests -v
      - name: Publish summary when all platform packages are available
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SUMMARY_VERSION: ${{ inputs.version }}
          RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
          IWE_UPDATE_SIGNING_KEY: ${{ secrets.IWE_UPDATE_SIGNING_KEY }}
        run: python3 .github/scripts/publish-summary.py
